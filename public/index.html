<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Card Pack Finder – Price Comparison</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js from CDN (no sensitive data sent) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img src="https://raw.githubusercontent.com/AntonioChieffallo/Pokemon-Card-Pack-finder/copilot/scrape-pokemon-cards-pricing/public/pokeball.svg"
           alt="" class="header-logo" onerror="this.style.display='none'" />
      <h1>Pokémon Card Pack Finder</h1>
      <p class="tagline">Search cards, packs &amp; boxes — compare market prices at a glance</p>
    </div>
  </header>

  <main class="container">

    <!-- Search bar -->
    <section class="search-section" aria-label="Search">
      <form id="searchForm" class="search-form" autocomplete="off">
        <div class="type-tabs" role="tablist" aria-label="Search type">
          <button type="button" class="tab-btn active" data-type="cards" role="tab" aria-selected="true">Cards</button>
          <button type="button" class="tab-btn" data-type="packs" role="tab" aria-selected="false">Packs</button>
          <button type="button" class="tab-btn" data-type="boxes" role="tab" aria-selected="false">Boxes</button>
        </div>
        <div class="search-row">
          <div class="search-input-wrap">
            <input
              id="searchInput"
              type="search"
              placeholder="e.g. Charizard, Base Set, Scarlet &amp; Violet…"
              aria-label="Search query"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="boxDropdown"
              required
            />
            <button id="suggestionsToggle" class="suggestions-toggle" type="button" aria-label="Show all suggestions" aria-expanded="false">▾</button>
            <div id="boxDropdown" class="box-dropdown" role="listbox" hidden></div>
          </div>
          <button type="submit" class="btn-primary">Search</button>
        </div>
      </form>
    </section>

    <!-- Status / loading -->
    <div id="statusMsg" class="status-msg" role="status" aria-live="polite" hidden></div>

    <!-- Results grid -->
    <section id="resultsSection" hidden aria-label="Search results">
      <div class="results-header">
        <h2 id="resultsTitle">Results</h2>
        <span id="resultsCount" class="results-count"></span>
      </div>
      <div id="resultsGrid" class="results-grid"></div>
    </section>

    <!-- Price chart section -->
    <section id="chartSection" class="chart-section" hidden aria-label="Price comparison chart">
      <h2 id="chartTitle">Price Comparison Chart</h2>
      <p id="chartSubtitle" class="chart-subtitle"></p>
      <div class="chart-wrapper">
        <canvas id="priceChart" role="img" aria-label="Bar chart comparing prices"></canvas>
      </div>
    </section>

    <!-- Deal summary -->
    <section id="dealSection" class="deal-section" hidden aria-label="Deal summary">
      <h2>Deal Summary</h2>
      <div id="dealGrid" class="deal-grid"></div>
    </section>

  </main>

  <div id="detailModal" class="detail-modal" hidden>
    <div id="detailBackdrop" class="detail-backdrop"></div>
    <section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button id="detailClose" class="detail-close" type="button" aria-label="Close details">×</button>
      <div class="detail-layout">
        <div class="detail-visual">
          <img id="detailImage" alt="" />
        </div>
        <div class="detail-content">
          <h2 id="detailTitle"></h2>
          <p id="detailSubtitle" class="detail-subtitle"></p>
          <div id="detailStats" class="detail-stats"></div>
          <div class="detail-chart-wrap">
            <canvas id="detailChart" role="img" aria-label="Detailed price chart"></canvas>
          </div>
          <div id="detailLinks" class="detail-links"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="imageZoomModal" class="image-zoom-modal" hidden>
    <div id="imageZoomBackdrop" class="image-zoom-backdrop"></div>
    <section class="image-zoom-panel" role="dialog" aria-modal="true" aria-label="Expanded card image">
      <button id="imageZoomClose" class="image-zoom-close" type="button" aria-label="Close image">×</button>
      <img id="imageZoomImg" alt="Expanded image" />
    </section>
  </div>

  <footer class="site-footer">
    <p>Price data sourced via <a href="https://pokemontcg.io/" target="_blank" rel="noopener noreferrer">Pokémon TCG API</a> (TCGPlayer market prices).
       MSRP references are approximate. Always verify before purchasing.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
